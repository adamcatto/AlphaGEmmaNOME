[project]
name = "omnigemmanome-alphagenome-svc"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "omnigemmanome-config",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.7",
    "alphagenome-pytorch",
    "torch>=2.2",
    "pyfaidx>=0.8",
    "numpy>=1.26",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
]

[tool.uv.sources]
omnigemmanome-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py"]
