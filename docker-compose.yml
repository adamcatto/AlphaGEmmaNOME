services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  alphagenome-svc:
    build:
      context: .
      dockerfile: services/alphagenome_svc/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./config:/app/config:ro
      - ./services/alphagenome_svc/data:/app/data
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN:-}
    depends_on:
      - ollama

  agent-backend:
    build:
      context: .
      dockerfile: services/agent_backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - OMNIGEMMA_OLLAMA__BASE_URL=http://ollama:11434
      - OMNIGEMMA_ALPHAGENOME__SERVICE_URL=http://alphagenome-svc:8001
    depends_on:
      - ollama
      - alphagenome-svc

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_AGENT_BACKEND_URL=http://localhost:8000
    depends_on:
      - agent-backend

volumes:
  ollama_data:
