[project]
name = "alphagemmanome"
version = "0.0.1"
description = "Functional-genomics chat app: Gemma-4B (Ollama) + LangGraph + alphagenome-pytorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alphagemmanome-config",
    "alphagemmanome-alphagenome-svc",
    "alphagemmanome-agent-backend",
    "uvicorn>=0.44.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
alphagemmanome-config = { workspace = true }
alphagemmanome-alphagenome-svc = { workspace = true }
alphagemmanome-agent-backend = { workspace = true }
torch = { index = "pytorch-cu126" }

[tool.uv.workspace]
members = [
    "config",
    "services/alphagenome_svc",
    "services/agent_backend",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
