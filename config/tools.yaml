# Macros: the default surface. One tool per canonical question.
analyze_gene_tf_binding:
  enabled: true

analyze_gene_expression:
  enabled: true

analyze_gene_arbitrary_tracks:
  enabled: true

analyze_region_regulation:
  enabled: true

analyze_variant_effect:
  enabled: true

upload_sequence:
  enabled: true

# Primitives: chainable low-level tools. OFF by default — small LLMs cannot
# plan reliable multi-step chains, and enabling them triggers cascades like
# gene_to_locus → predict_tracks (wrong window) → list_tracks_by_assay loop.
# Re-enable only for power-user flows with a stronger model.
gene_to_locus:
  enabled: true

predict_tracks:
  enabled: false

predict_variant_effect:
  enabled: false

list_tracks_by_assay:
  enabled: false

get_top_tracks:
  enabled: false

render_panel:
  enabled: false

parse_hgvs:
  enabled: false

# Phase 2 macros — high-level public-API wrappers (enabled by default).
analyze_variant_clinical:
  enabled: true

analyze_gwas_associations:
  enabled: true

analyze_known_regulatory_elements:
  enabled: true

analyze_gtex_expression:
  enabled: true

# Phase 2 primitives — disabled by default; enable for power-user flows.
query_clinvar:
  enabled: false

query_gnomad:
  enabled: false

query_gwas_catalog:
  enabled: false

query_encode_elements:
  enabled: false

query_gtex_expression:
  enabled: false

query_conservation:
  enabled: false

scan_jaspar_motifs:
  enabled: false

# Phase 3 macros — AlphaGenome advanced analysis (enabled by default).
analyze_splicing:
  enabled: true

analyze_3d_contacts:
  enabled: true

analyze_differential_regulation:
  enabled: true

analyze_large_region:
  enabled: true

design_crispr_guide:
  enabled: true

# Phase 3 primitives — ISM-based (disabled by default; each call requires
# N×3 AlphaGenome forward passes — can take several minutes).
analyze_attribution:
  enabled: false

optimize_sequence:
  enabled: false

optimize_edits:
  enabled: true

