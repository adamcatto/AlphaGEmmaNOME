version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
root:
  level: INFO
  handlers: [console]
loggers:
  services.alphagenome_svc:
    level: INFO
  services.agent_backend:
    level: DEBUG
  smolagents:
    level: INFO
